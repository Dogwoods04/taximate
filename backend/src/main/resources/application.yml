spring:
  application:
    name: taximate
  config:
    # Local secrets (KAKAO_REST_API_KEY etc.) in backend/.env — git-ignored, optional.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taximate}
    username: ${DB_USERNAME:taximate}
    password: ${DB_PASSWORD:taximate}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Each module owns a version range (V10-19 identity, V20-29 trip, ...), so a new migration in a lower
    # range can arrive after higher ones are applied. Allow it instead of renumbering.
    out-of-order: true
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

taximate:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  lock:
    mode: ${LOCK_MODE:local}          # local | redis
    redis-url: ${REDIS_URL:redis://localhost:6379}
    wait-millis: 3000
    lease-millis: 10000
  auth:
    dev-login-enabled: ${DEV_LOGIN_ENABLED:true}
    admin-nicknames: ${ADMIN_NICKNAMES:admin}
    kakao:
      enabled: ${KAKAO_LOGIN_ENABLED:}
      rest-api-key: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      allowed-redirect-uris: ${KAKAO_REDIRECT_URIS:http://localhost:5173/auth/kakao,http://127.0.0.1:5173/auth/kakao}
      auth-base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
      api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  privacy:
    coordinate-decimals: 3            # ~110m grid for coordinates shown to other users
    path-trim-meters: 200             # trim route ends shown to other users
    location-retention-hours: 24      # precise coords nulled this long after trip ends
  kakao:
    mode: ${KAKAO_MODE:mock}          # mock | kakao
    rest-api-key: ${KAKAO_REST_API_KEY:}
    local-base-url: https://dapi.kakao.com
    mobility-base-url: https://apis-navi.kakaomobility.com
    timeout-millis: 3000
  demo:
    keep-alive-prefix: ${DEMO_KEEPALIVE_PREFIX:}   # e.g. 샘플 — keeps rooms of these hosts departing 1–2.5h ahead (UX testing only)
  walking:
    tmap-app-key: ${TMAP_APP_KEY:}     # SK open API (TMAP pedestrian route). Empty => straight-line estimate
    tmap-base-url: https://apis.openapi.sk.com
    timeout-millis: 3000
  route:
    snapshot-ttl-minutes: 30
  matching:
    priority-radius-meters: 200
    max-radius-meters: 500
    min-direction-cosine: 0.7
    min-overlap-ratio: 0.5
    overlap-buffer-meters: 150
    max-departure-diff-minutes: 30
    max-candidates: 20
    weights:
      origin-distance: 0.25
      destination-distance: 0.15
      overlap: 0.30
      departure-time: 0.20
      detour: 0.10
  meeting-point:
    near-radius-meters: 200
    max-radius-meters: 500
    max-suggestions: 5
    walking-check-limit: 3
  conversation:
    message-max-length: 500
    retention-days: 30
