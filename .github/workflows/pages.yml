name: Deploy frontend to GitHub Pages

# Builds frontend/ and publishes it to https://<owner>.github.io/<repo>/.
# Repository settings used at build time:
#   vars.API_BASE_URL    – public backend URL (e.g. a Cloudflare tunnel). Empty => mock mode (in-browser fake backend).
#   secrets.KAKAO_JS_KEY – Kakao JavaScript key (domain-restricted; register https://<owner>.github.io in Kakao console).
# Re-run with "Run workflow" after changing API_BASE_URL (quick tunnels get a new URL on every start).

on:
  push:
    branches: [master, main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_MODE: ${{ vars.API_BASE_URL != '' && 'http' || 'mock' }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: npm run build
      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links / refreshes load the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
